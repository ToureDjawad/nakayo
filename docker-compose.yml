services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nakayo
      POSTGRES_PASSWORD: nakayo
      POSTGRES_DB: nakayo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Base jetable pour les tests du serveur (vidée à chaque lancement de `npm run test:server`).
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: nakayo
      POSTGRES_PASSWORD: nakayo
      POSTGRES_DB: nakayo_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:

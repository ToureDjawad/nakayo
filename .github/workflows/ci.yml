name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nakayo
          POSTGRES_PASSWORD: nakayo
          POSTGRES_DB: nakayo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nakayo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nakayo:nakayo@localhost:5432/nakayo
      DATABASE_URL_TEST: postgres://nakayo:nakayo@localhost:5432/nakayo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint du front et de l'API
        run: npm run lint
      - name: Base de test de l'API
        run: PGPASSWORD=nakayo psql -h localhost -U nakayo -d nakayo -c 'CREATE DATABASE nakayo_test'
      - name: Tests de l'API (unitaires, intégration, bout en bout)
        run: npm run test:server
      - name: Build du front
        run: npm run build
      - name: Migrations PostgreSQL
        run: npm run db:migrate

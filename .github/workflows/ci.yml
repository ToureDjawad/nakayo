name: CI

# Les minutes d'Actions sont comptées (dépôt privé) : chaque job ne tourne que si ce qu'il teste a
# changé, et un nouveau push sur la PR annule le passage précédent. Une PR est toujours à jour de main
# avant sa fusion : le push sur main n'est donc pas retesté (lancement à la main possible).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changements:
    name: Changements
    runs-on: ubuntu-latest
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filtre.outputs.web == 'true' }}
      e2e: ${{ github.event_name == 'workflow_dispatch' || steps.filtre.outputs.e2e == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filtre.outputs.android == 'true' }}
      emulateur: ${{ github.event_name == 'workflow_dispatch' || steps.filtre.outputs.emulateur == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filtre
        with:
          filters: |
            commun: &commun
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
            web:
              - *commun
              - 'client/**'
              - 'server/**'
            e2e:
              - *commun
              - 'client/**'
            android:
              - *commun
              - 'android/**'
              - 'server/**'
            emulateur:
              - '.github/workflows/ci.yml'
              - 'android/**'

  build:
    name: Build
    needs: changements
    if: needs.changements.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nakayo
          POSTGRES_PASSWORD: nakayo
          POSTGRES_DB: nakayo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nakayo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nakayo:nakayo@localhost:5432/nakayo
      DATABASE_URL_TEST: postgres://nakayo:nakayo@localhost:5432/nakayo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint du front et de l'API
        run: npm run lint
      - name: Base de test de l'API
        run: PGPASSWORD=nakayo psql -h localhost -U nakayo -d nakayo -c 'CREATE DATABASE nakayo_test'
      - name: Tests de l'API (unitaires, intégration, bout en bout)
        run: npm run test:server
      - name: Tests unitaires et d'intégration du front
        run: npm run test -w @nakayo/client
      # Les tests de bout en bout du front tournent sur l'API simulée : seulement si client/ change.
      # Les bibliothèques système de Chromium sont déjà sur les machines GitHub (Chrome y est installé) :
      # si les miroirs apt ne répondent pas, on installe le navigateur seul plutôt que d'échouer.
      - name: Navigateur des tests de bout en bout
        if: needs.changements.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium || npx playwright install chromium
        working-directory: client
      - name: Tests de bout en bout du front
        if: needs.changements.outputs.e2e == 'true'
        run: npm run test:e2e
      - name: Rapport des tests de bout en bout
        if: failure() && needs.changements.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: client/playwright-report
          retention-days: 7
      - name: Build du front
        run: npm run build
      - name: Migrations PostgreSQL
        run: npm run db:migrate

  android:
    name: Android
    needs: changements
    if: needs.changements.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nakayo
          POSTGRES_PASSWORD: nakayo
          POSTGRES_DB: nakayo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nakayo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://nakayo:nakayo@localhost:5432/nakayo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Noyau (unitaires, intégration, bout en bout sur la vraie API)
        working-directory: android
        run: ./gradlew :noyau:test :noyau:apiReelle
      - name: App (tests unitaires, lint, builds debug et release)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      # L'émulateur ne tourne que si android/ change : les écrans testés utilisent un faux service.
      - name: API pour les tests sur émulateur
        if: needs.changements.outputs.emulateur == 'true'
        run: |
          cd server
          NODE_ENV=test CONTROLES_RESEAU=false DATABASE_URL="$DATABASE_URL_TEST" PORT=3000 nohup node src/index.js > ../api-android.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://localhost:3000/api/health && exit 0; sleep 0.2; done
          cat ../api-android.log; exit 1
      - name: Place libre pour l'émulateur
        if: needs.changements.outputs.emulateur == 'true'
        # L'image Android 14 demande plus de 7 Go ; le runner n'en laisse parfois que 6,9.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Accès KVM pour l'émulateur
        if: needs.changements.outputs.emulateur == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Image de l'émulateur et instantané de démarrage gardés en cache : les passages suivants
      # démarrent l'émulateur en quelques secondes au lieu de le créer et de le démarrer à froid.
      - name: Cache de l'émulateur
        if: needs.changements.outputs.emulateur == 'true'
        uses: actions/cache@v4
        id: cache-avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-v1
      - name: Création de l'instantané de l'émulateur
        if: needs.changements.outputs.emulateur == 'true' && steps.cache-avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Instantané de l'émulateur créé."
      - name: Tests instrumentés sur émulateur (Android 14)
        if: needs.changements.outputs.emulateur == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Rapports Android en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-android
          path: |
            android/noyau/build/reports
            android/app/build/reports
            api-android.log
          retention-days: 7
